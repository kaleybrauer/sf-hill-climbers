# Test, build and deploy the page to GitHub Pages on every push to main,
# including edits made in GitHub's web editor.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: node tests/core.test.js && node tests/geocode.test.js
      - name: Build
        run: python3 build.py
      # Redraw the link-preview card from the page just built. If this fails,
      # the committed web/preview.png is used instead.
      - name: Link-preview image
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python3 tools/make_preview.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
